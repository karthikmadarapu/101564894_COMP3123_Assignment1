$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees/{{resourceA}}"
method: PUT
body:
  type: json
  content: '{ "position": "Senior Developer", "salary": 85000 }'
auth:
  type: bearer
  credentials:
    token: "{{tokenA}}"
scripts:
  - type: afterResponse
    code: '  pm.test("200 OK", () => pm.response.to.have.status(200));'
    language: text/javascript
order: 4000
