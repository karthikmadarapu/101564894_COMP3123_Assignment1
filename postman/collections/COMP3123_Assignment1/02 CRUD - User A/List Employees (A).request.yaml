$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenA}}"
scripts:
  - type: afterResponse
    code: "  pm.test(\"200 OK\", () => pm.response.to.have.status(200));\r

      \  const list = pm.response.json();\r

      \  pm.test(\"Returns an array\", () => pm.expect(list).to.be.an(\"array\"));\r

      \  pm.test(\"Contains A's employee\", () => {\r

      \    const ids = list.map(e => e._id || e.employee_id);\r

      \    pm.expect(ids).to.include(pm.environment.get(\"resourceA\"));\r

      \  });"
    language: text/javascript
order: 2000
