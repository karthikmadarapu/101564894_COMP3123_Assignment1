$kind: http-request
url: "{{baseUrl}}/api/v1/user/signup"
method: POST
body:
  type: json
  content: "   {\r

    \     \"username\": \"userB\",\r

    \     \"email\": \"{{emailB}}\",\r

    \     \"password\": \"Password123!\"\r

    \   }"
scripts:
  - type: beforeRequest
    code: "   // A fresh email every run, so re-running never hits \"email already exists\"\r

      \   pm.environment.set(\"emailB\", `a_${Date.now()}@test.com`);"
    language: text/javascript
  - type: afterResponse
    code: "   pm.test(\"User B registered (201)\", () => {\r

      \     pm.response.to.have.status(201); // use 200 if your API returns that\r

      \   });"
    language: text/javascript
order: 3000
